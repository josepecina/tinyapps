<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiny Apps</title>
<meta name="description" content="Tiny Apps: TinyQuit to smoke less at your own pace and, soon, TinySave to save money. Free.">
<meta property="og:title" content="Tiny Apps"><meta property="og:description" content="Small apps for big habits ☁️"><meta property="og:image" content="https://josepecina.github.io/tinyapps/islas.jpg">
<meta name="theme-color" content="#7FD0FF">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Web Tiny Apps (28 nov, v2). Escala de espacios = la de las apps (GUIA-DISENO §0.3 y §0.15): bloque 16 · misma categoría 12 · padding 16 · bordes ≥ 16.
   Se comprueba con _comun/qa/qa_espacios.py (13 idiomas × móvil pequeño, móvil, tablet, ordenador) → ESPACIOS_WEB_OK.
   App nueva = una línea más en APPS (abajo, en el script). Idioma nuevo = i18n.js. */
:root{--ink:#22324F;--muted:#5A6785;--sh:0 14px 26px rgba(35,105,175,.18);--gap:16px;--same:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
p,li,.tag,summary{text-wrap:pretty}
body{font-family:Nunito,system-ui,sans-serif;font-weight:700;color:var(--ink);min-height:100vh;background:linear-gradient(#7FD0FF,#BDE8FF 45%,#DDF3FF 75%);overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.puff{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift 22s linear infinite}
.puff::before,.puff::after{content:"";position:absolute;background:#fff;border-radius:50%}
.puff::before{width:55%;height:150%;left:15%;top:-70%}.puff::after{width:40%;height:120%;right:12%;top:-45%}
.hills{position:fixed;left:0;right:0;bottom:0;z-index:-1;pointer-events:none}
.wrap{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 96px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:var(--same);position:relative;z-index:5}
.flag{flex:none;border-radius:4px;box-shadow:0 2px 4px rgba(34,50,79,.15)}
.langbtn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 6px 14px rgba(35,105,175,.18);font-family:Nunito;font-weight:900;font-size:15px;color:var(--ink);cursor:pointer}
.langbtn .chev{width:9px;height:9px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) translateY(-2px);margin:0 2px 0 2px}
.langmenu{position:absolute;right:0;top:52px;width:250px;max-height:min(70vh,560px);overflow:auto;background:#fff;border-radius:20px;padding:8px;box-shadow:0 16px 40px rgba(35,105,175,.28);display:none}
.langmenu.open{display:block}
.langmenu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:14px;background:none;font-family:Nunito;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.langmenu button:hover,.langmenu button.on{background:#EEF5FB}
header{text-align:center}
.logo{width:92px;height:92px;border-radius:50%;border:4px solid #fff;box-shadow:var(--sh);animation:float 3.4s ease-in-out infinite}
h1{font-family:Fredoka;font-weight:700;font-size:clamp(40px,11vw,60px);margin:6px 0 0;line-height:1.05}
h1 b{color:#1FA89A}
.tag{color:var(--muted);font-weight:800;font-size:17px;line-height:1.35;margin:8px 0 var(--gap)}
.social{display:flex;justify-content:center;gap:var(--same);margin-bottom:var(--gap)}
.b3d{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-family:Fredoka;font-weight:600;color:var(--ink);background:linear-gradient(#fff,#EEF5FB);border-radius:22px;box-shadow:0 7px 0 #C5D5E6,0 14px 20px rgba(35,105,175,.28),inset 0 3px 0 rgba(255,255,255,.55);transition:transform .09s,box-shadow .09s;min-width:0}
.b3d:active{transform:translateY(5px);box-shadow:0 2px 0 #C5D5E6,0 5px 10px rgba(35,105,175,.28)}
.social .b3d{width:56px;height:56px;border-radius:50%}.social svg{width:26px;height:26px}
.gold{color:#5A3E00;background:linear-gradient(#FFE27A,#F5C02E);box-shadow:0 7px 0 #C99400,0 14px 20px rgba(201,148,0,.25),inset 0 3px 0 rgba(255,255,255,.5)}
.gold:active{box-shadow:0 2px 0 #C99400,0 5px 10px rgba(201,148,0,.25)}
.teal{color:#fff;background:linear-gradient(#3FD0BF,#1FA89A);box-shadow:0 7px 0 #14806F,0 14px 20px rgba(31,168,154,.3),inset 0 3px 0 rgba(255,255,255,.3)}
.teal:active{box-shadow:0 2px 0 #14806F,0 5px 10px rgba(31,168,154,.3)}
.islas{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:26px;display:block;box-shadow:var(--sh);border:4px solid #fff;margin-bottom:var(--gap)}
.card{background:#fff;border-radius:28px;padding:16px;box-shadow:var(--sh),inset 0 -6px 0 rgba(160,200,235,.35);margin-bottom:var(--gap);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.row{display:flex;gap:14px;align-items:center}
.ico{width:76px;height:76px;border-radius:20px;flex:none;box-shadow:0 6px 14px rgba(35,105,175,.25)}
.txt{min-width:0;flex:1}
.name{font-family:Fredoka;font-weight:700;font-size:28px;line-height:1.05;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.what{margin:6px 0 0;font-weight:800;font-size:15.5px;line-height:1.35;color:var(--muted)}
.btns{display:grid;gap:var(--same);margin-top:var(--gap)}
/* Botones de tienda con el diseño oficial (negro, borde gris, logo, texto pequeño arriba y nombre grande) */
.badge{position:relative;display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;border-radius:12px;background:#000;border:1.5px solid #A6A6A6;color:#fff;text-decoration:none;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Roboto,Arial,sans-serif;min-width:0}
.badge svg.logo2{width:28px;height:28px;flex:none}
.badge .lb{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.badge small{font-size:11px;font-weight:500;letter-spacing:.2px;white-space:nowrap}
.badge .big{font-size:22px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.badge.off{opacity:.45;cursor:default}
.badge .lb{flex:1 1 auto}
.badge .soon{flex:none;margin-left:auto;font-family:Nunito;font-weight:900;font-size:11.5px;padding:4px 10px;border-radius:999px;background:#FFF3C4;color:#9A6B00;white-space:nowrap}
.badge.off .soon{opacity:1}
.wide{height:56px;font-size:18px;padding:0 16px}
.fit{display:block;white-space:nowrap;overflow:hidden;max-width:100%}
.fit.mq>span{display:inline-block;animation:mq 6s ease-in-out infinite alternate}
.chip{font-family:Nunito;font-weight:900;font-size:11.5px;letter-spacing:.3px;padding:4px 10px;border-radius:999px;background:#FFF3C4;color:#9A6B00;line-height:1.2}
details{margin-top:var(--same);border-radius:18px;background:#F4F8FC}
summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:Fredoka;font-weight:600;font-size:17px;padding:0 16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details[open] summary::after{transform:rotate(225deg) translateY(-3px)}
ol{margin:0;padding:0 16px 16px 38px;font-size:15px;line-height:1.5}ol li+li{margin-top:6px}
.next .name{font-size:24px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--same);margin-top:var(--gap)}
.mini{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:20px;background:linear-gradient(#EEF7FF,#DDEBF8);box-shadow:inset 0 -5px 0 rgba(160,200,235,.5)}
.mini .q{font-size:34px;line-height:1}.mini .lock{width:18px;height:18px}
footer{margin-top:var(--gap);text-align:center;color:var(--muted)}
.foot{background:rgba(255,255,255,.88);border-radius:28px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:var(--same)}
.frow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:var(--same);width:100%}
.contact{height:52px;padding:0 22px;font-size:17px;border-radius:999px;flex:1 1 100%}
.contact svg{width:22px;height:22px}
.lk{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;background:#EEF5FB;color:var(--ink);text-decoration:none;font-weight:800;font-size:14.5px;text-align:center}
.made{margin:4px 0 0;font-size:13.5px;font-weight:800;line-height:1.45}
.made span{display:block}
.made .mail{color:var(--ink)}
.made .copy{font-size:12px;color:#8A98B2}
/* Ordenador y tablet: dos columnas, Tiny Apps a la izquierda (fija) y las apps a la derecha */
@media (min-width:900px){
 .wrap{max-width:1080px;padding:24px 32px 120px;display:grid;grid-template-columns:400px 1fr;column-gap:40px;align-items:start}
 .topbar{grid-column:1/-1}
 .left{position:sticky;top:24px}
 h1{font-size:60px}
 footer{grid-column:1/-1}
 .btns.stores{grid-template-columns:1fr 1fr}
 .contact{flex:0 0 auto;height:44px;padding:0 16px;font-size:14.5px;font-family:Nunito;font-weight:800;box-shadow:0 4px 0 #14806F,0 8px 14px rgba(31,168,154,.25)}
 .contact svg{width:18px;height:18px}
}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes pop{from{transform:scale(.92) translateY(16px);opacity:0}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes mq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--mq))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sky">
  <div class="puff" style="width:140px;height:40px;top:8%;animation-duration:38s"></div>
  <div class="puff" style="width:100px;height:30px;top:30%;animation-duration:30s;animation-delay:-12s"></div>
  <div class="puff" style="width:160px;height:46px;top:55%;animation-duration:44s;animation-delay:-25s"></div>
</div>
<svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none" height="110" width="100%"><path d="M0 60 Q100 20 200 50 T400 40 V120 H0Z" fill="#9BE58A"/><path d="M0 85 Q120 55 240 80 T400 75 V120 H0Z" fill="#5FD46A"/></svg>
<div class="wrap">
  <div class="topbar">
    <button class="langbtn" id="langbtn" aria-haspopup="listbox" aria-expanded="false"><span id="langflag"></span><span id="langName">Español</span><span class="chev"></span></button>
    <div class="langmenu" id="langmenu" role="listbox"></div>
  </div>
  <div class="left">
    <header>
      <img class="logo" src="logo.jpg" alt="Tiny">
      <h1>Tiny <b>Apps</b></h1>
      <div class="tag" data-t="tag"></div>
      <nav class="social" aria-label="social">
        <a class="b3d" href="https://www.tiktok.com/@hellotinyapps" aria-label="TikTok" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path fill="#22324F" d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.4 7.4 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/></svg></a>
        <a class="b3d" href="https://www.instagram.com/hellotinyapps/" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#22324F" stroke-width="2.2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#22324F" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="#22324F"/></svg></a>
        <a class="b3d" href="https://www.youtube.com/@hellotinyapps" aria-label="YouTube" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#FF3B3B"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg></a>
      </nav>
    </header>
    <img class="islas" src="islas.jpg" alt="Tiny Apps">
  </div>
  <main>
    <div id="apps"></div>
    <section class="card next">
      <p class="name"><span data-t="next"></span><span class="chip" data-t="locked"></span></p><p class="what" data-t="nextTxt"></p>
      <div class="minis" id="minis"></div>
    </section>
  </main>
  <footer>
    <div class="foot">
      <div class="frow">
        <a class="b3d teal contact" href="mailto:hellotinyapps@gmail.com"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg><span data-t="contact"></span></a>
        <a class="lk" id="lpriv" data-t="privacy" target="_blank" rel="noopener"></a>
        <a class="lk" id="lterm" data-t="terms" target="_blank" rel="noopener"></a>
      </div>
      <p class="made"><span data-t="made"></span><span class="mail">hellotinyapps@gmail.com</span><span class="copy">© 2026 Tiny Apps</span></p>
    </div>
  </footer>
</div>
<script src="i18n.js"></script>
<script>
(function(){
  // ── CONFIGURACIÓN (lo único que se toca al haber novedades) ──
  // Cada app = una línea. state: 'live' (con tiendas) o 'soon' (MUY PRONTO + botón para probarla). ios: '' mientras Apple no la apruebe.
  var APPS=[
    {id:'quit', a:'Tiny', b:'Quit', color:'#2E9BE6', icon:'tinyquit.jpg', state:'live', play:'https://play.google.com/store/apps/details?id=com.tinyapps.tinyquit', ios:''},  // al aprobar: 'https://apps.apple.com/app/id6837468388'
    {id:'save', a:'Tiny', b:'Save', color:'#E0A800', icon:'tinysave.jpg', state:'soon', tester:'https://groups.google.com/g/tinyapps-testers'}
  ];
  var NEXT=['📚','⛰️','🌙'];   // pistas de las que vienen (se quita una cuando su app entra en APPS)
  var LEGAL='https://josepecina.github.io/tinyquit/';
  // ──
  var T=window.TA_I18N, FL=window.TA_FLAGS, codes=Object.keys(T), cur;
  var ua=navigator.userAgent||'', ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function flag(c,w,h){return '<svg class="flag" viewBox="0 0 30 20" width="'+w+'" height="'+h+'" aria-hidden="true"><clipPath id="f'+c+w+'"><rect width="30" height="20" rx="5"/></clipPath><g clip-path="url(#f'+c+w+')">'+FL[c]+'</g></svg>';}
  function pick(){
    var q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1]; if(q&&T[q]) return q;
    try{var s=localStorage.getItem('ta.lang'); if(s&&T[s]) return s;}catch(e){}
    var L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
    for(var i=0;i<L.length;i++){var c=String(L[i]).slice(0,2).toLowerCase(); if(T[c]) return c;}
    return 'en';
  }
  var gpI='<svg class="logo2" viewBox="0 0 24 24"><path fill="#00D7FE" d="M3.6 2.2c-.3.3-.4.8-.4 1.4v16.8c0 .6.1 1.1.4 1.4l.1.1 9.4-9.4v-.2L3.7 2.1z"/><path fill="#FFCE00" d="M16.2 15.6L13.1 12.4v-.2l3.1-3.1.1.1 3.7 2.1c1.1.6 1.1 1.6 0 2.2l-3.7 2.1z"/><path fill="#FF3A44" d="M16.3 15.5L13.1 12.3l-9.5 9.5c.4.4.9.4 1.6.1l11.1-6.4"/><path fill="#00F076" d="M16.3 9.1L5.2 2.7c-.7-.4-1.2-.3-1.6.1l9.5 9.5z"/></svg>';
  var apI='<svg class="logo2" viewBox="0 0 24 24"><path fill="#fff" d="M16.4 12.6c0-2.4 2-3.5 2-3.6a4.3 4.3 0 0 0-3.4-1.8c-1.4-.2-2.8.8-3.5.8s-1.8-.8-3-.8a4.5 4.5 0 0 0-3.8 2.3c-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3s1.6-.7 3-.7 1.8.7 3 .7 2-1.1 2.8-2.3a9.7 9.7 0 0 0 1.3-2.6 4 4 0 0 1-2.5-3.6zM14.1 5.5A4 4 0 0 0 15 2.6a4.1 4.1 0 0 0-2.7 1.4 3.8 3.8 0 0 0-1 2.8 3.4 3.4 0 0 0 2.8-1.3z"/></svg>';
  function badge(href,icon,small,big,soon){return '<a class="badge'+(soon?' off':'')+'" '+(soon?'aria-disabled="true"':'href="'+href+'" target="_blank" rel="noopener"')+'>'+icon+'<span class="lb"><small class="fit"><span>'+small+'</span></small><span class="big fit"><span>'+big+'</span></span></span>'+(soon?'<span class="soon">'+soon+'</span>':'')+'</a>';}
  function appCard(a,t){
    var h='<section class="card"><div class="row"><img class="ico" src="'+a.icon+'" alt="'+a.a+a.b+'"><div class="txt"><p class="name"><span>'+a.a+'<b style="color:'+a.color+'">'+a.b+'</b></span>'+(a.state==='soon'?'<span class="chip">'+t.soon+'</span>':'')+'</p><p class="what">'+t[a.id]+'</p></div></div>';
    if(a.state==='live'){var g=badge(a.play,gpI,t.gp,'Google Play'), s=badge(a.ios,apI,t.as,'App Store',a.ios?'':t.asSoon); h+='<div class="btns stores">'+(ios?s+g:g+s)+'</div>';}
    else{h+='<div class="btns"><a class="b3d gold wide" href="'+a.tester+'" target="_blank" rel="noopener"><span class="fit"><span>'+t.saveBtn+'</span></span></a></div><details><summary>'+t.how+'</summary><ol><li>'+t.s1+'</li><li>'+t.s2+'</li><li>'+t.s3+'</li><li>'+t.s4+'</li></ol></details>';}
    return h+'</section>';
  }
  function render(c){
    cur=c; var t=T[c]; document.documentElement.lang=c;
    document.getElementById('langName').textContent=t.name; document.getElementById('langflag').innerHTML=flag(c,27,18);
    document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=t[e.getAttribute('data-t')]||T.en[e.getAttribute('data-t')];});
    var sfx=c==='es'?['privacidad','terminos']:c==='en'?['privacy','terms']:['privacy-'+c,'terms-'+c];
    document.getElementById('lpriv').href=LEGAL+sfx[0]+'.html'; document.getElementById('lterm').href=LEGAL+sfx[1]+'.html';
    document.getElementById('apps').innerHTML=APPS.map(function(a){return appCard(a,t);}).join('');
    document.getElementById('minis').innerHTML=NEXT.map(function(e){return '<div class="mini"><span class="q">'+e+'</span><svg class="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3" fill="#8A98B2"/><path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="#8A98B2" stroke-width="2.4"/></svg></div>';}).join('');
    document.getElementById('langmenu').innerHTML=codes.map(function(k){return '<button role="option" data-l="'+k+'"'+(k===c?' class="on" aria-selected="true"':'')+'>'+flag(k,27,18)+'<span>'+T[k].name+'</span></button>';}).join('');
    requestAnimationFrame(fitAll);
  }
  // Textos de botón: si no caben, se reducen hasta el 80 %; si aun así no caben, se desplazan de lado a lado (GUIA-DISENO §0.15)
  function fitAll(){document.querySelectorAll('.fit').forEach(function(f){var s=f.firstElementChild; f.classList.remove('mq'); s.style.fontSize=''; var base=parseFloat(getComputedStyle(f).fontSize);
    var kmin=Math.max(0.8,11/base); for(var k=1;k>=kmin-1e-6&&f.scrollWidth>f.clientWidth;k-=0.05){s.style.fontSize=(base*k)+'px';}
    if(f.scrollWidth>f.clientWidth){f.style.setProperty('--mq',(f.clientWidth-s.offsetWidth)+'px');f.classList.add('mq');f.setAttribute('data-fit','marquee');} else f.setAttribute('data-fit','ok');});}
  var btn=document.getElementById('langbtn'), menu=document.getElementById('langmenu');
  function openMenu(o){menu.classList.toggle('open',o);btn.setAttribute('aria-expanded',o?'true':'false');}
  btn.addEventListener('click',function(e){e.stopPropagation();openMenu(!menu.classList.contains('open'));});
  menu.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;try{localStorage.setItem('ta.lang',b.dataset.l);}catch(x){} render(b.dataset.l);openMenu(false);});
  document.addEventListener('click',function(){openMenu(false);});document.addEventListener('keydown',function(e){if(e.key==='Escape')openMenu(false);});
  render(pick());
  window.addEventListener('resize',function(){requestAnimationFrame(fitAll);});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
})();
</script>
</body>
</html>
